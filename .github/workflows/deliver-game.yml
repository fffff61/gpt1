name: Deliver Realm Guard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - name: Verify local HTML in Microsoft Edge
        run: python tools/test_standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: RealmGuard-Standalone
          path: |
            downloads/RealmGuard-Standalone.zip
            downloads/standalone-title.png
            downloads/standalone-resumed.png
          compression-level: 0
          retention-days: 30
  publish-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish verified web build
        id: deployment
        uses: actions/deploy-pages@v4
